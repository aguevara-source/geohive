# Plataforma completa: gateway + autenticación por correo + base de datos + portal + aplicaciones.
# Cada aplicación (apps/<id>) tiene su propio frontend, backend y base de datos.
name: geohive

# Conexión a la base PostgreSQL (definida en .env). Cada servicio usa su propio esquema.
x-base-datos: &base-datos
  PG_HOST: ${PG_HOST}
  PG_PORT: ${PG_PORT}
  PG_USER: ${PG_USER}
  PG_PASSWORD: ${PG_PASSWORD}
  PG_DATABASE: ${PG_DATABASE}

services:
  # ---------- Infraestructura compartida ----------
  auth-api:
    build: ./services/auth
    restart: unless-stopped
    environment:
      <<: *base-datos
      DB_SCHEMA: auth
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SEGURIDAD: ${SMTP_SEGURIDAD:-starttls}
      CORREO_REMITENTE: ${CORREO_REMITENTE}
      CONTACTO_DESTINO: ${CONTACTO_DESTINO:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para PG_HOST=host.docker.internal también en Linux

  # Buzón de pruebas: captura los correos salientes (ver http://localhost:8025).
  # En producción configura un SMTP real en .env y elimina este servicio.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/gateway/includes:/etc/nginx/includes:ro
    depends_on: [portal, auth-api, visor-web, visor-api, geocodificador-web, geocodificador-api]

  # ---------- Portal (solo presentación) ----------
  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
      args:
        SOLO_PRESENTACION: ${SOLO_PRESENTACION:-false}
    restart: unless-stopped

  # ---------- App: Visor ----------
  visor-web:
    build: { context: ., dockerfile: apps/visor/frontend/Dockerfile }
    restart: unless-stopped

  visor-api:
    build: ./apps/visor/backend
    restart: unless-stopped
    environment:
      <<: *base-datos
      DB_SCHEMA: visor
      AUTH_ISSUER: ${PUBLIC_URL}/auth
      AUTH_JWKS_URL: http://auth-api:8000/jwks.json
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para PG_HOST=host.docker.internal también en Linux

  # ---------- App: Geocodificador ----------
  geocodificador-web:
    build: { context: ., dockerfile: apps/geocodificador/frontend/Dockerfile }
    restart: unless-stopped

  geocodificador-api:
    build: ./apps/geocodificador/backend
    restart: unless-stopped
    environment:
      <<: *base-datos
      DB_SCHEMA: geocodificador
      AUTH_ISSUER: ${PUBLIC_URL}/auth
      AUTH_JWKS_URL: http://auth-api:8000/jwks.json
      NOMINATIM_USER_AGENT: GeoHive/1.0 (${PUBLIC_URL})
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para PG_HOST=host.docker.internal también en Linux

