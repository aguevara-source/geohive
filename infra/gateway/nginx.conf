# =========================================================
# Gateway GEOHIVE: único punto de entrada a la plataforma
#   /                     → portal (presentación) y /login/
#   /auth/                → servicio de autenticación (código por correo)
#   /<app>/               → frontend de cada aplicación
#   /api/<app>/           → backend de cada aplicación
# Para agregar una app: copia un bloque "App" y súmala en docker-compose.yml
# =========================================================
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# DNS interno de Docker. Los destinos van en variables para que nginx los resuelva en cada
# petición (cada 10 s como máximo): si un contenedor se recrea y cambia de IP, el gateway lo sigue.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  client_max_body_size 50m;

  gzip on;
  gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

  set $auth_api           auth-api:8000;
  set $portal             portal:80;
  set $visor_web          visor-web:80;
  set $visor_api          visor-api:8000;
  set $geocodificador_web geocodificador-web:80;
  set $geocodificador_api geocodificador-api:8000;

  # ---------- Autenticación ----------
  # Solicitar y verificar códigos, y formulario de contacto: máx. 10 por minuto por IP
  location ~ ^/auth/(codigo|verificar|contacto)$ {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/includes/proxy.inc;
    proxy_pass http://$auth_api/$1;
  }
  location /auth/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/includes/proxy.inc;
    rewrite ^/auth/(.*)$ /$1 break;
    proxy_pass http://$auth_api;
  }

  # ---------- App: Visor ----------
  location /visor/ {
    include /etc/nginx/includes/security-headers.inc;
    include /etc/nginx/includes/proxy.inc;
    proxy_pass http://$visor_web;
  }
  location /api/visor/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/includes/proxy.inc;
    rewrite ^/api/visor/(.*)$ /$1 break;
    proxy_pass http://$visor_api;
  }

  # ---------- App: Geocodificador ----------
  location /geocodificador/ {
    include /etc/nginx/includes/security-headers.inc;
    include /etc/nginx/includes/proxy.inc;
    proxy_pass http://$geocodificador_web;
  }
  location /api/geocodificador/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/includes/proxy.inc;
    rewrite ^/api/geocodificador/(.*)$ /$1 break;
    proxy_pass http://$geocodificador_api;
  }

  # ---------- Portal y login ----------
  location / {
    include /etc/nginx/includes/security-headers.inc;
    include /etc/nginx/includes/proxy.inc;
    proxy_pass http://$portal;
  }
}
