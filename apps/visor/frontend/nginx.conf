server {
  listen 80;
  root /usr/share/nginx/html;

  # Módulos ES (.mjs, ej. el worker de MapLibre): nginx no los reconoce por defecto
  location ~* ^/visor/assets/.+\.mjs$ {
    types { application/javascript mjs; }
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /visor/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier ruta de la app devuelve index.html
  location /visor/ {
    try_files $uri $uri/ /visor/index.html;
    add_header Cache-Control "no-cache";
  }
}
