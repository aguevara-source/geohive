server {
  listen 80;
  root /usr/share/nginx/html;

  location /geocodificador/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier ruta de la app devuelve index.html
  location /geocodificador/ {
    try_files $uri $uri/ /geocodificador/index.html;
    add_header Cache-Control "no-cache";
  }
}
